# 256-Farben-Modus aktivieren
set -g default-terminal "tmux-256color"

# Cursorform/-blink (DECSCUSR) an das äußere Terminal durchreichen
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Fokuswechsel an Programme in den Panes melden (Claude Code, vim, …)
set -g focus-events on

# Modifizierte Tasten (Shift+Enter, Ctrl+Enter …) als CSI u durchreichen,
# dazu OSC-8-Hyperlinks. Fester Index statt -a, damit erneutes Sourcen nichts dupliziert.
# Greift für Ghostty, weil dessen TERM (xterm-ghostty) auf 'xterm*' passt.
set -s extended-keys on
set -s extended-keys-format csi-u
set -s terminal-features[10] 'xterm*:extkeys:hyperlinks'

# Aktualisierungsintervall (Sekunden)
set -g status-interval 1

# Grundfarben der Statuszeile (TokyoNight)
set -g status-style bg=#1a1b26,fg=#c0caf5

# Position
set -g status-position bottom

# --- LINKE SEITE (Session-Name) ---
set -g status-left-length 50
# Segment färbt sich pink, solange tmux nach Ctrl+b auf die nächste Taste wartet
set -g status-left "#[bg=#{?client_prefix,#ff0066,#7aa2f7},fg=#15161e,bold]  #S #[bg=#1a1b26,fg=#{?client_prefix,#ff0066,#7aa2f7},nobold]"

set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Fenstertitel des äußeren Terminals = Pane-Titel der aktiven Pane (👻 + cwd bzw. laufender Befehl)
set -g set-titles on
set -g set-titles-string '#T'

# --- RECHTE SEITE (Datum, Uhrzeit) ---
# set -g status-right-length 50
# set -g status-right "#[fg=#313244]#[bg=#313244,fg=#a6e3a1]  %d.%m.%Y #[fg=#a6e3a1]#[bg=#a6e3a1,fg=#11111b,bold]  %H:%M "
# set -g status-right "#[fg=#313244]#[bg=#313244,fg=#a6e3a1] #{b:pane_current_path}"
# Farbverlauf Statuszeilen-Hintergrund -> Pink (Catppuccin-Mocha-Palette)
# set -g status-right-length 20
# set -g status-right "#[bg=#1e1e2e] #[bg=#292738] #[bg=#352f41] #[bg=#40384b] #[bg=#4b4155] #[bg=#57495f] #[bg=#625268] #[bg=#6d5a72] #[bg=#79637c] #[bg=#846c86] #[bg=#8f748f] #[bg=#9a7d99] #[bg=#a686a3] #[bg=#b18ead] #[bg=#bc97b6] #[bg=#c89fc0] #[bg=#d3a8ca] #[bg=#deb1d4] #[bg=#eab9dd] #[bg=#f5c2e7] #[default]"
set -g status-right-length 0
set -g status-right ""

# --- MITTE (Fenster-Liste) ---
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7]#[fg=#15161e,bold] #I:#W #[fg=#bb9af7,bg=#1a1b26]"

# Inaktive Fenster farblich abheben
set -g window-status-style fg=#565f89,bg=#1a1b26
# tmux-Default ist "underscore" – würde die Powerline-Pfeile mit unterstreichen
set -g window-status-current-style default

# --- VERSCHACHTELT IM CONTAINER ---
# Inneres tmux: Leiste oben, eigene Farbe, Prefix-Hinweis gelb statt rot.
# Greift nur, wenn diese Datei auch im Container liegt (gemountet oder ins Image kopiert).
if-shell '[ -f /.dockerenv ]' {
  set -g status-position top
  set -g status-style bg=#24283b,fg=#c0caf5
  set -g status-left "#[bg=#{?client_prefix,#e0af68,#9ece6a},fg=#15161e,bold] 🐳 #S #[bg=#24283b,fg=#{?client_prefix,#e0af68,#9ece6a},nobold]"
}

bind c new-window -c "#{pane_current_path}"

# --- Maus & Pane-History ---
set -g mouse on
set -g history-limit 100000

# Scrollen der Pane-History ohne Copy-Mode-Umweg
bind -n C-S-Up       copy-mode -e \; send -X scroll-up
bind -n C-S-Down     if -F '#{pane_in_mode}' 'send -X scroll-down'
bind -n C-S-PPage    copy-mode -e \; send -X page-up
bind -n C-S-NPage    if -F '#{pane_in_mode}' 'send -X page-down'
bind -n C-S-Home     copy-mode -e \; send -X history-top
bind -n C-S-End      if -F '#{pane_in_mode}' 'send -X cancel'
